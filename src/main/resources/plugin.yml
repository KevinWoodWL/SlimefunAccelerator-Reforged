name: SlimefunAcceleratorReforged
author: KevinWoodWL
description: A Leaf-friendly remaster of SlimefunAccelerator with safe region-aware machine tick scheduling.
main: com.balugaq.slimefunaccelerator.implementation.SlimefunAccelerator
website: https://github.com/KevinWoodWL/SlimefunAccelerator
version: ${project.version}
api-version: 1.17
depend:
  - Slimefun
softdepend:
  - GuizhanLibPlugin
commands:
  slimefunaccelerator:
    aliases:
      - sa
      - accelerator
    description: /slimefunaccelerator
    usage: /slimefunaccelerator <sub>
