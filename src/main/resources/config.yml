# Enable SlimefunAccelerator runtime after Slimefun has finished loading.
enabled: true

# Auto update from Guizhan Build is enabled by default.
# Auto update or not.
auto-update: true
# Build station to use.
build-station: "Guizhan" # Expected "Guizhan" or "Blob"

# Do not change this value unless you know what you are doing.
config-version: C_20260517_2

# Do not change this value unless you know what you are doing.
debug: false

# Per-item circuit breaker. When a ticker overruns max-tick-time-micros
# for `overrun-threshold` consecutive samples, the breaker trips. The
# `action` decides whether the item is fully skipped or just throttled.
circuit-breaker:
  enabled: true
  # What to do during a trip:
  #   throttle - let every Nth call through (default). Machine keeps
  #              working, just slower. Players don't see "broken".
  #   skip     - drop every call until cooldown expires. Most relief
  #              for the server but the machine appears dead.
  action: throttle
  # In throttle mode, run 1 in every N ticks while tripped.
  # 4 = quarter speed.
  throttle-divisor: 4
  # Microseconds. 10000us = 10ms. Set higher if your items are inherently slow.
  max-tick-time-micros: 10000
  # Consecutive overruns needed for the FIRST trip. After a trip,
  # any single overrun re-trips immediately until recovery-samples
  # clean ticks elapse.
  overrun-threshold: 20
  # Ticks to wait before the breaker re-opens (600 = 30s @ 20tps).
  cooldown-ticks: 600
  # Consecutive clean (under threshold) samples needed to be marked
  # fully recovered (so overrun-threshold applies again, not 1).
  recovery-samples: 200
  # EMA smoothing factor for the per-item moving average (0.01-0.9).
  # Smaller = smoother, slower to react.
  ema-alpha: 0.1

# Throttle the accelerator when the server is already overloaded.
load-aware:
  enabled: true
  # Below this TPS, accelerated rounds run every other call.
  throttle-tps: 18.0
  # Below this TPS, accelerated rounds are skipped entirely until TPS recovers.
  skip-tps: 15.0

# If a group's previous round is still marked running after
# (period * group-timeout-multiplier) ticks, drop the queued
# ticks and start a fresh round. Prevents indefinite wedge.
group-timeout-multiplier: 5
