# Allows color codes
messages:
  debug-prefix: "&b[Debug] "
  commands:
    no-permission: "You don't have permission to use this command!"
    player-only: "This command can only be used by players!"
    console-only: "This command can only be used by the console!"
    not-slimefun-item-in-hand: "You must be holding a Slimefun item in your hand!"
    click-to-copy: "Click to copy"
    help:
      header: "&b[Help] &fHelp Commands."
      help: "&f/slimefunaccelerator help &7- &fShows this help message."
      enable: "&f/slimefunaccelerator enable &7- &fEnables the accelerator runtime."
      disable: "&f/slimefunaccelerator disable &7- &fDisables the accelerator and restores original tickers."
      reload: "&f/slimefunaccelerator reload &7- &fReloads accelerator configuration."
      version: "&f/slimefunaccelerator version &7- &fShows the plugin version."
      stats: "&f/slimefunaccelerator stats [n] &7- &fShows TPS + top-N expensive items."
    enable:
      success: "&aAccelerator enabled."
      already-enabled: "&eAccelerator is already enabled."
    disable:
      success: "&aAccelerator disabled and original tickers restored."
      already-disabled: "&eAccelerator is already disabled."
    reload:
      success: "&aReloaded accelerator configuration successfully."
    version:
      # {version} = plugin version
      success: "&aVersion: &f{version}"
    id:
      # {id} = item ID
      success: "&aItem ID: &f{id}"
    stats:
      header: "&b[Stats] &fAccelerator profiler snapshot"
      tps: "&7Server TPS: &f{tps}"
      profiler-off: "&7Circuit breaker is disabled — no per-item stats."
      no-samples: "&7No items have been ticked yet."
      # {tripped} currently-tripped items out of {total} total tracked
      tripped-summary: "&7Tripped now: &c{tripped}&7/&f{total}"
      # {id}, {ema}/{avg}/{max} in ms, {samples}, {trips}, {skipped}, {suffix}
      row: "&f{id} &7ema &f{ema}ms &7avg &f{avg}ms &7max &c{max}ms &7n={samples} trips={trips} skip={skipped}{suffix}"
      # {cooldown} seconds remaining
      row-tripped: " &c[TRIPPED {cooldown}s]"
  load:
    # {id} = item ID
    added-accelerates: "Accelerated for {id}"
    # {count} = skipped item count, {addon} = addon name, {group} = accelerate group
    skipped-native-compat: "Compatibility bypass: skipped {count} items from {addon} in group {group}; keeping Slimefun native ticker."
    # {count} = wrapped item count, {divisor} = low-TPS throttle divisor
    native-throttle-installed: "Native throttle: wrapped {count} compatibility-sensitive items; low-TPS speed can drop to 1/{divisor}."
    no-configured-accelerates: "You have not configured the SlimefunAccelerator plugin. Please check the example config.yml file."
    invalid-accelerate-key: "Invalid accelerate key in config.yml: "
    # {path} = path to config file
    path: "Path: {path}"
    # {value} = value of config option
    value: "Value: {value}"
