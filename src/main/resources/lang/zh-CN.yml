# Allows color codes
messages:
  debug-prefix: "&b[Debug] "
  commands:
    no-permission: "你没有权限使用这个指令!"
    player-only: "这个指令只能由玩家使用!"
    console-only: "这个指令只能由控制台使用!"
    not-slimefun-item-in-hand: "你必须手持 Slimefun 物品才能使用这个指令!"
    click-to-copy: "点击复制"
    help:
      header: "&b[Help] &f帮助."
      help: "&f/slimefunaccelerator help &7- &f显示帮助菜单."
      enable: "&f/slimefunaccelerator enable &7- &f启用加速器运行时."
      disable: "&f/slimefunaccelerator disable &7- &f关闭加速器并还原原始 ticker."
      reload: "&f/slimefunaccelerator reload &7- &f重新加载加速器配置."
      version: "&f/slimefunaccelerator version &7- &f显示插件版本."
      stats: "&f/slimefunaccelerator stats [n] &7- &f显示 TPS 和 top-N 耗时物品."
    enable:
      success: "&a加速器已启用."
      already-enabled: "&e加速器已经处于启用状态."
    disable:
      success: "&a加速器已关闭，原始 ticker 已还原."
      already-disabled: "&e加速器已经处于关闭状态."
    reload:
      success: "&a加速器配置已重新加载."
    version:
      # {version} = plugin version
      success: "&a插件版本: &f{version}"
    id:
      # {id} = item ID
      success: "&a物品 ID: &f{id}"
    stats:
      header: "&b[Stats] &f加速器统计快照"
      tps: "&7服务器 TPS: &f{tps}"
      profiler-off: "&7熔断器已关闭 — 无每物品统计数据."
      no-samples: "&7还没有任何物品被 tick 过."
      # {tripped} 当前熔断中物品数 / {total} 已采样总数
      tripped-summary: "&7熔断中: &c{tripped}&7/&f{total}"
      # {id}, {ema}/{avg}/{max} 单位 ms
      row: "&f{id} &7ema &f{ema}ms &7avg &f{avg}ms &7max &c{max}ms &7n={samples} 熔断={trips} 跳过={skipped}{suffix}"
      # {cooldown} 剩余冷却秒数
      row-tripped: " &c[熔断 {cooldown}s]"
  load:
    failed-auto-update: "&c自动更新失败: {message}" # {message} = error message
    # {id} = item ID
    added-accelerates: "已加速 {id}"
    # {count} = skipped item count, {addon} = addon name, {group} = accelerate group
    skipped-native-compat: "兼容旁路: 已跳过 {count} 个来自 {addon} 的物品，组: {group}，保留 Slimefun 原生 ticker."
    # {count} = wrapped item count, {divisor} = low-TPS throttle divisor
    native-throttle-installed: "原生降频: 已包装 {count} 个兼容敏感物品，低 TPS 时最多降至 1/{divisor} 速度."
    no-configured-accelerates: "你还没有开始配置插件!"
    invalid-accelerate-key: "无效的物品: "
    # {path} = path to config file
    path: "位置: {path}"
    # {value} = value of config option
    value: "值: {value}"
