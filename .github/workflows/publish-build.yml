name: Publish build

on:
  push:
    branches:
      - master

jobs:
  publish:
    name: Build and Release
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[ci skip]') == false

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Build with Maven
        run: mvn -B package -DskipTests

      - name: Read project version
        id: pom
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          SHORT_SHA=${GITHUB_SHA::7}
          IS_SNAPSHOT=false
          if [[ "$VERSION" == *SNAPSHOT* ]]; then IS_SNAPSHOT=true; fi
          echo "version=${VERSION}"           >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}"       >> "$GITHUB_OUTPUT"
          echo "is_snapshot=${IS_SNAPSHOT}"   >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # SNAPSHOTs include the short SHA so every dev push gets a unique tag.
          # Stable releases reuse the bare version tag (idempotent).
          tag_name: ${{ steps.pom.outputs.is_snapshot == 'true' && format('build-{0}-{1}', steps.pom.outputs.version, steps.pom.outputs.short_sha) || format('v{0}', steps.pom.outputs.version) }}
          name: ${{ steps.pom.outputs.is_snapshot == 'true' && format('{0} ({1})', steps.pom.outputs.version, steps.pom.outputs.short_sha) || format('v{0}', steps.pom.outputs.version) }}
          body: ${{ github.event.head_commit.message }}
          prerelease: ${{ steps.pom.outputs.is_snapshot == 'true' }}
          make_latest: ${{ steps.pom.outputs.is_snapshot == 'false' && 'true' || 'false' }}
          files: target/SlimefunAcceleratorReforged*.jar
